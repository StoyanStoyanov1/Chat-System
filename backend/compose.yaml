services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: hotel_workforce
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: